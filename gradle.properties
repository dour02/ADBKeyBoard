# 强制指定JDK17路径
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64
# 彻底禁用daemon（8.x专用参数）
org.gradle.daemon=true
# 精简JVM参数，移除不兼容的opens
#org.gradle.jvmargs=-Xms512m -Xmx2g -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Djava.net.preferIPv6Addresses=false
# 关闭并行、减少资源冲突
org.gradle.parallel=true
#org.gradle.workers.max=1

