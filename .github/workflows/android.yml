name: Android CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]          # 推送 v 开头的 tag（如 v2.1）时自动发 Release
  pull_request:
    branches: [ master ]
  workflow_dispatch:        # 允许在 Actions 页面手动运行

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # 不指定 ref，构建触发本次运行的那个提交/tag

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Version name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=2.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      # 没有配置签名 Secrets 时这一步跳过，只产出 debug 包
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleDebug assembleRelease
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp keyboardservice/build/outputs/apk/debug/*.apk "out/ADBKeyboard-${VERSION_NAME}-debug.apk"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp keyboardservice/build/outputs/apk/release/*.apk "out/ADBKeyboard-${VERSION_NAME}.apk"
          fi
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ADBKeyboard-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
