apply plugin: 'com.android.application'

// Signing information is read from environment variables (provided by GitHub Actions Secrets).
def ksFile = System.getenv('SIGNING_STORE_FILE')
def hasSigning = ksFile != null && file(ksFile).exists()

def configuredVersionCode = (System.getenv('VERSION_CODE') ?: '5') as int
def effectiveVersionCode = Math.max(5, configuredVersionCode)

android {
    namespace 'com.android.adbkeyboard'
    compileSdk 33

    defaultConfig {
        applicationId 'com.android.adbkeyboard'
        minSdk 24
        targetSdk 33
        versionCode effectiveVersionCode
        versionName System.getenv('VERSION_NAME') ?: '2.3'
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
