apply plugin: 'com.android.application'

// 签名信息从环境变量读取（GitHub Actions 里由 Secrets 注入），本地没设置时 release 包不签名
def ksFile = System.getenv('SIGNING_STORE_FILE')
def hasSigning = ksFile != null && file(ksFile).exists()

def configuredVersionCode = (System.getenv('VERSION_CODE') ?: '3') as int
def effectiveVersionCode = Math.max(3, configuredVersionCode)

android {
    namespace 'com.android.adbkeyboard'
    compileSdk 33
    defaultConfig {
        applicationId 'com.android.adbkeyboard'
        minSdk 24          // dispatchGesture 需要 API 24
        targetSdk 33
        // 最低版本码提升到 3；CI 可继续使用更大的 GitHub Actions run_number。
        versionCode effectiveVersionCode
        versionName System.getenv('VERSION_NAME') ?: '2.1'
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(ksFile)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
            }
        }
    }
    buildTypes {
        // 配了正式签名后 debug 包也用同一把 key，便于覆盖安装。
        debug {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
